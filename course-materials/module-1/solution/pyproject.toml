[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "salesreport"
version = "0.1.0"
description = "Daily store revenue reporting CLI - Module 1 lab solution"
requires-python = ">=3.11"
dependencies = [
    "click==8.1.7",
]

[project.scripts]
salesreport = "salesreport.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/salesreport"]
