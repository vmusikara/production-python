services:
  postgres:
    image: postgres:16
    container_name: pp4de_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mock-api:
    build:
      context: ./infra/mock-api
    container_name: pp4de_mock_api
    restart: unless-stopped
    environment:
      RANDOM_SEED: ${RANDOM_SEED:-42}
      RECORDS_PER_DAY: ${RECORDS_PER_DAY:-537}
      PAGE_SIZE: ${PAGE_SIZE:-50}
      MALFORMED_RATE: ${MALFORMED_RATE:-0.03}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-10}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-10}
      TIMEOUT_RATE: ${TIMEOUT_RATE:-0.05}
      TIMEOUT_HANG_SECONDS: ${TIMEOUT_HANG_SECONDS:-12}
      DUPLICATE_PAGE_NUMBER: ${DUPLICATE_PAGE_NUMBER:-3}
      EMPTY_PAGE_NUMBER: ${EMPTY_PAGE_NUMBER:-0}
    ports:
      - "${MOCK_API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
